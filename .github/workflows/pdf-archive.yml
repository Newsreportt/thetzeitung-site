name: PDF archive
# Turns every issue folder of the office's Google Drive into one PDF in the R2 bucket for the
# shop (see _pdf/archive.py). Runs on demand and every Sunday night for the new issues; a run
# that could not finish in its hours starts another one.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only the volume folders whose name contains this (e.g. Vol 39)"
        default: ""
      redo:
        description: "Make the PDFs again even where they exist (true/false)"
        default: "false"
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
  actions: write
concurrency:
  group: pdf-archive
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pypdf boto3 google-auth
      - name: Build the PDFs
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ONLY="${{ github.event.inputs.only }}"; REDO="${{ github.event.inputs.redo }}"
          python3 _pdf/archive.py ${ONLY:+--only "$ONLY"} $([ "$REDO" = "true" ] && echo --redo) --hours 5.2
      - name: Record which PDFs exist
        if: always()
        run: |
          git config user.name "pdf-archive"
          git config user.email "pdf-archive@users.noreply.github.com"
          git add pdfs.json _pdf/manifest.json
          git commit -qm "PDF archive: $(python3 -c "import json; print(len(json.load(open('pdfs.json'))))") editions as PDFs" || echo "nothing new"
          git pull -q --rebase origin main && git push -q origin HEAD:main
      - name: Another run if issues are left
        if: always()
        run: |
          LEFT=$(cat _pdf/again 2>/dev/null || echo 0)
          if [ "${LEFT:-0}" -gt 0 ]; then
            echo "$LEFT issues left: starting another run"
            gh workflow run pdf-archive.yml --ref main -f only="${{ github.event.inputs.only }}" -f redo=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
