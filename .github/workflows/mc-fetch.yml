name: Fetch Mailchimp covers
on:
  push:
    branches: [mc-fetch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python _mc/fetch.py
      - name: Publish images to the mc-raw branch
        run: |
          cd _mc
          git init -q -b mc-raw
          git config user.name "cover-fetch"
          git config user.email "cover-fetch@users.noreply.github.com"
          git add img fetch.log manifest.tsv
          git commit -qm "Mailchimp cover images (fetched $(date -u +%F))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mc-raw:mc-raw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
