name: Fetch a year of covers
on:
  push:
    branches: [year-fetch]
  workflow_dispatch:
    inputs:
      round:
        description: "Round number (the crawler chains rounds while Google throttles it)"
        default: "1"
permissions:
  contents: write
  actions: write
concurrency:
  group: year-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: pip install -q gdown
      - name: Resume from the year-raw branch
        run: |
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch year-raw "$REPO" _year/raw; then
            echo "resuming: $(ls _year/raw/out 2>/dev/null | grep -c -- '-zoom.jpg') covers already rendered"
          else
            mkdir -p _year/raw && cd _year/raw && git init -q -b year-raw && git remote add origin "$REPO"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python _year/crawl.py _year/job.json _year/raw/out
      - name: Publish to the year-raw branch
        if: always()
        run: |
          cp _year/job.json _year/raw/job.json
          cd _year/raw
          git config user.name "cover-fetch"
          git config user.email "cover-fetch@users.noreply.github.com"
          git add out job.json
          git commit -qm "First pages from the Drive folders (round ${{ github.event.inputs.round || '1' }})" || echo "nothing new"
          git push -q origin HEAD:year-raw
      - name: Another round if Google throttled this one
        if: always()
        run: |
          ROUND="${{ github.event.inputs.round || '1' }}"
          if [ -f _year/raw/again ] && [ "$ROUND" -lt 30 ]; then
            read -r LEFT FETCHED < _year/raw/again || true
            echo "$LEFT covers left ($FETCHED PDFs fetched this round); starting round $((ROUND + 1))"
            if [ "${FETCHED:-0}" -eq 0 ]; then
              echo "nothing came through: waiting an hour for Google's quota before the next round"
              sleep 3600
            fi
            gh workflow run year-fetch.yml --ref year-fetch -f round=$((ROUND + 1))
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
